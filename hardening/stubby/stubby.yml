# stubby.yml - DORiS encrypted DNS (direct/untrusted connection mode).
# stubby listens on 127.0.0.1:53 (dnssec validation on, caching on) and
# forwards over DoT (TLS 853) to Cloudflare and Quad9. NetworkManager
# points every connection at 127.0.0.1, so all system DNS is encrypted.

resolution_type: GETDNS_RESOLUTION_STUB

dns_transport_list:
  - GETDNS_TRANSPORT_TLS

tls_authentication: GETDNS_AUTHENTICATION_REQUIRED
tls_query_padding_blocksize: 128

edns_client_subnet_private: 1
round_robin_upstreams: 1

listen_addresses:
  - 127.0.0.1@53
  - 0::1@53

upstream_recursive_servers:
  - address_data: 1.1.1.1
    tls_auth_name: "cloudflare-dns.com"
  - address_data: 1.0.0.1
    tls_auth_name: "cloudflare-dns.com"
  - address_data: 9.9.9.9
    tls_auth_name: "dns.quad9.net"
  - address_data: 149.112.112.112
    tls_auth_name: "dns.quad9.net"
  - address_data: 2606:4700:4700::1111
    tls_auth_name: "cloudflare-dns.com"
  - address_data: 2620:fe::fe
    tls_auth_name: "dns.quad9.net"

idle_timeout: 10000
appdata_dir: "/var/cache/stubby"
