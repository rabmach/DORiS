# DORiS - 60-doris-performance.conf
# Low-latency / desktop-performance sysctls, neutral and safe on any
# amd64 box with a stock Debian kernel.
#
# Installed by hardening task 05, applied by systemd-sysctl at boot.
# Every knob below EXISTS on stock Debian (verified) and does NOT
# disable any security feature - it only tunes scheduling latency and
# page-cache behavior. Reversible: delete the file and reboot.
#
# NOTE: the classic EEVDF knobs (sched_latency_ns, sched_min_granularity_ns,
# sched_wakeup_granularity_ns) were REMOVED in kernel 6.12 and are not set
# here on purpose - they are gone on stock Debian kernels.

# Scheduler / interrupt latency
kernel.nmi_watchdog = 0          # stop the watchdog's periodic perf-counter work
kernel.timer_migration = 0       # keep timers on the CPU that scheduled them
kernel.sched_autogroup_enabled = 0

# Page cache (RAM-heavy desktop: keep files cached, avoid swap)
vm.swappiness = 10
vm.vfs_cache_pressure = 50
