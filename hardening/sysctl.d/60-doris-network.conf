# DORiS - 60-doris-network.conf
# Network performance + ICMP-redirect hardening, neutral and safe on any
# amd64 box (this host is a client, not a router).
#
#   bbr + fq    : latency/throughput win on real internet (negligible on LAN).
#   fastopen=3  : client+server side TCP Fast Open.
#   redirects=0 : standard client hardening; never send/accept ICMP redirects.

net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3

net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
