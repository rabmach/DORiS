# Based on the BunsenLith theme by Brex
# adapted for Lilidog by sleekmason 18 apr 2022
# recolored to gruvbox-dark to match the Gruvbox-Dark gtk theme, 2026
# (Changed colours are all in the [named colors] section.)

[theme_info]
name=gruvbox-ld
description=A theme to match the gtk theme Gruvbox-Dark. Recolored from the Lilidog Nordic-ld template.
version=1
author=sleekmason <sleekmason@gmail.com>
url=
# list of each compatible Geany release version
compat=1.22;1.23;1.23.1;1.24

[named_colors]
fg=#EBDBB2
bg=#282828
error_red=#cc241d
selection_bg=#504945
current_line_bg=#3C3836
alert_fg=#EBDBB2

brace_bg_good=#458588
brace_bg_bad=#CC241D

comment_fg=#928374
comment_doc_fg=#83A598

whitespace=#504945

dbl_quoted_str_fg=#B8BB26
sgl_quoted_str_fg=#8EC07C
keywd_fg=#FB4934
param_fg=#83A598

[named_styles]
default=fg;bg;false;false
error=error_red;;true;false

# Editor styles
#-------------------------------------------------------------------------------

selection=alert_fg;selection_bg;false;true
current_line=;current_line_bg;true;
brace_good=fg;brace_bg_good;true;false
brace_bad=alert_fg;brace_bg_bad;true;false
margin_line_number=#928374
margin_folding=#A89984;#3C3836
fold_symbol_highlight=#EBDBB2
indent_guide=whitespace;;;
caret=#EBDBB2;#282828;false
marker_line=#282828;#FABD2F;
marker_search=#282828;#83A598;
marker_mark=#282828;#B8BB26;
call_tips=#EBDBB2;#3C3836
white_space=whitespace;#fff;true;false

# Programming languages
#-------------------------------------------------------------------------------

comment=comment_fg;;;
comment_doc=comment_doc_fg;;;
comment_line=comment
comment_line_doc=comment_doc
comment_doc_keyword=comment_doc,bold
comment_doc_keyword_error=comment_doc_keyword,italic

number=#D3869B
number_1=number
number_2=number_1

type=#FABD2F
class=type
function=default
parameter=param_fg;;;

keyword=keywd_fg;;;
keyword_1=keyword
keyword_2=#98971A;;true
keyword_3=keyword_1
keyword_4=keyword_1

identifier=default
identifier_1=identifier
identifier_2=identifier_1
identifier_3=identifier_1
identifier_4=identifier_1

string=dbl_quoted_str_fg;;;
string_1=string
string_2=string_1
string_3=default
string_4=default
string_eol=#282828;#CC241D
character=sgl_quoted_str_fg;;;
backticks=#8EC07C
# here_doc ???
here_doc=#D3869B

scalar=#B8BB26
# label ???
label=default,bold
preprocessor=#D3869B
regex=#8EC07C
operator=#FE8019
decorator=preprocessor
other=default
extra=#83A598

# Markup-type languages
#-------------------------------------------------------------------------------

tag=type
tag_unknown=tag,italic
tag_end=tag
attribute=keyword
attribute_unknown=attribute,italic
value=string_1
entity=preprocessor

# Diff
#-------------------------------------------------------------------------------

line_added=#B8BB26
line_removed=#FB4934
line_changed=#D3869B
